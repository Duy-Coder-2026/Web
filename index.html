
<script>
"use strict";

const $ = selector => document.querySelector(selector);

function showStatus(element, message, type = "") {
  element.textContent = message;
  element.className = "status" + (type ? " " + type : "");
  element.classList.remove("hidden");
}

function hideStatus(element) {
  element.textContent = "";
  element.className = "status hidden";
}

// ==================== ĐIỀU HƯỚNG ====================

function switchTab(id) {
  document.querySelectorAll(".tab").forEach(section => {
    section.classList.toggle("hidden", section.id !== id);
  });

  document.querySelectorAll("[data-tab]").forEach(button => {
    const active = button.dataset.tab === id;
    button.classList.toggle("active", active);
    button.setAttribute("aria-current", active ? "page" : "false");
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.querySelectorAll("[data-tab]").forEach(button => {
  button.addEventListener("click", () => switchTab(button.dataset.tab));
});

document.querySelectorAll("[data-go]").forEach(button => {
  button.addEventListener("click", () => switchTab(button.dataset.go));
});

// ==================== HẰNG SỐ AN TOÀN ====================

const MAX_URL_LENGTH = 2048;
const MAX_SCORE = 100;

const SUSPICIOUS_WORDS = new Set([
  "login", "signin", "verify", "verification",
  "password", "credential", "wallet", "banking",
  "reset", "confirm", "suspended", "unlock",
  "secure", "update", "auth", "payment"
]);

// Một số tên thương hiệu thường bị giả mạo.
// Danh sách này chỉ là quy tắc tham khảo, không phải danh sách đầy đủ.
const BRANDS = [
  { name: "Google", domains: ["google.com"] },
  { name: "Microsoft", domains: ["microsoft.com", "live.com", "outlook.com"] },
  { name: "Apple", domains: ["apple.com", "icloud.com"] },
  { name: "Facebook", domains: ["facebook.com", "fb.com"] },
  { name: "Instagram", domains: ["instagram.com"] },
  { name: "PayPal", domains: ["paypal.com"] },
  { name: "Amazon", domains: ["amazon.com"] },
  { name: "Netflix", domains: ["netflix.com"] },
  { name: "GitHub", domains: ["github.com"] },
  { name: "Zalo", domains: ["zalo.me", "zalo.vn"] }
];

const SHORTENERS = new Set([
  "bit.ly", "tinyurl.com", "t.co", "is.gd",
  "cutt.ly", "rebrand.ly", "shorturl.at",
  "rb.gy", "lnk.to"
]);

// ==================== HÀM HỖ TRỢ ====================

function addFinding(findings, id, points, title, description, severity = "medium") {
  findings.push({
    id,
    points,
    title,
    description,
    severity
  });
}

function isIPv4(host) {
  const parts = host.split(".");
  if (parts.length !== 4) return false;

  return parts.every(part =>
    /^\d{1,3}$/.test(part) &&
    Number(part) >= 0 &&
    Number(part) <= 255
  );
}

function isPrivateIPv4(host) {
  if (!isIPv4(host)) return false;

  const [a, b] = host.split(".").map(Number);

  return (
    a === 10 ||
    a === 127 ||
    (a === 172 && b >= 16 && b <= 31) ||
    (a === 192 && b === 168) ||
    (a === 169 && b === 254) ||
    a === 0
  );
}

function isIPAddress(host) {
  // URL.hostname có thể trả IPv6 ở dạng có hoặc không có ngoặc,
  // tùy cách xử lý của trình duyệt.
  return isIPv4(host) ||
    /^\[[0-9a-f:.]+\]$/i.test(host) ||
    /^[0-9a-f]{0,4}:[0-9a-f:.]+$/i.test(host);
}

function getRegistrableApproximation(host) {
  // Chỉ là phép ước lượng dựa trên nhãn tên miền.
  // Không thay thế Public Suffix List.
  const parts = host.split(".");
  return parts.length >= 2 ? parts.slice(-2).join(".") : host;
}

function normalizeInput(value) {
  const input = value.trim();

  if (!input) {
    throw new Error("Bạn chưa nhập URL.");
  }

  if (input.length > MAX_URL_LENGTH) {
    throw new Error("URL quá dài. Giới hạn là 2048 ký tự.");
  }

  // Không tự đoán giao thức để tránh diễn giải đầu vào mơ hồ.
  if (!/^https?:\/\//i.test(input)) {
    throw new Error(
      "Hãy nhập URL đầy đủ bắt đầu bằng https:// hoặc http://."
    );
  }

  // Từ chối ký tự điều khiển và khoảng trắng bên trong URL.
  if (/[\u0000-\u0020\u007f]/.test(input)) {
    throw new Error(
      "URL chứa khoảng trắng hoặc ký tự điều khiển không hợp lệ."
    );
  }

  return input;
}

function parseUrl(value) {
  const input = normalizeInput(value);
  let url;

  try {
    url = new URL(input);
  } catch {
    throw new Error("URL không hợp lệ. Hãy kiểm tra lại địa chỉ.");
  }

  if (!["http:", "https:"].includes(url.protocol)) {
    throw new Error("Chỉ hỗ trợ HTTP và HTTPS.");
  }

  if (!url.hostname) {
    throw new Error("Không tìm thấy tên máy chủ trong URL.");
  }

  if (url.username || url.password) {
    throw new Error(
      "URL chứa thông tin đăng nhập. Vì an toàn, công cụ từ chối URL này."
    );
  }

  if (url.hostname.length > 253) {
    throw new Error("Tên máy chủ vượt quá giới hạn độ dài.");
  }

  return url;
}

function containsMixedScripts(host) {
  // Phát hiện sơ bộ tên miền Unicode trộn Latin với một số hệ chữ khác.
  // Đây không phải bộ phát hiện homograph hoàn chỉnh.
  const hasLatin = /[a-z]/i.test(host);
  const hasOther = /[\u0400-\u052f\u0370-\u03ff\u0590-\u08ff]/u.test(host);

  return hasLatin && hasOther;
}

function decodeForInspection(value) {
  let result = value;

  // Giải mã có giới hạn để tránh vòng lặp vô hạn với chuỗi lỗi.
  for (let i = 0; i < 3; i++) {
    try {
      const decoded = decodeURIComponent(result);
      if (decoded === result) break;
      result = decoded;
    } catch {
      break;
    }
  }

  return result;
}

// ==================== PHÂN TÍCH URL ====================

function analyzeUrl(value) {
  const url = parseUrl(value);

  const host = url.hostname.toLowerCase();
  const asciiHost = new URL(url.href).hostname.toLowerCase();
  const full = url.href;
  const decoded = decodeForInspection(full);

  const findings = [];
  const flags = new Set();

  function flag(id, points, title, description, severity = "medium") {
    if (flags.has(id)) return;
    flags.add(id);
    addFinding(findings, id, points, title, description, severity);
  }

  // 1. Giao thức
  if (url.protocol === "http:") {
    flag(
      "http",
      12,
      "Kết nối HTTP",
      "Dữ liệu truyền qua kết nối này không được HTTPS bảo vệ. Điều này không tự động chứng minh website lừa đảo.",
      "medium"
    );
  }

  // 2. Tên miền IP
  if (isIPAddress(host)) {
    flag(
      "ip",
      18,
      "Sử dụng địa chỉ IP trực tiếp",
      "Địa chỉ IP không nhất thiết độc hại, nhưng liên kết đăng nhập hoặc thanh toán dùng IP trực tiếp cần được xác minh kỹ.",
      "medium"
    );

    if (isPrivateIPv4(host)) {
      flag(
        "private-ip",
        3,
        "Địa chỉ IPv4 nội bộ hoặc đặc biệt",
        "Địa chỉ này thuộc một dải IPv4 nội bộ hoặc dành riêng. Nó có thể hợp lệ trong mạng riêng, nhưng không phải bằng chứng về website công khai."
      );
    }
  }

  // 3. Punycode và ký tự Unicode
  if (asciiHost.split(".").some(part => part.startsWith("xn--"))) {
    flag(
      "punycode",
      15,
      "Tên miền có nhãn Punycode",
      "Tên miền chứa nhãn xn-- được dùng để biểu diễn một số ký tự Unicode. Hãy kiểm tra kỹ tên miền thực tế vì có thể xuất hiện tên giả mạo."
    );
  }

  if (containsMixedScripts(host)) {
    flag(
      "mixed-scripts",
      18,
      "Tên miền trộn nhiều hệ chữ",
      "Tên miền có dấu hiệu trộn chữ Latin với một hệ chữ khác. Đây có thể là cách tạo ký tự giống thương hiệu thật."
    );
  }

  // 4. Cấu trúc hostname
  const labels = host.split(".");
  const domain = getRegistrableApproximation(host);

  if (labels.length >= 5) {
    flag(
      "many-labels",
      7,
      "Tên miền có nhiều cấp",
      "Tên miền có nhiều nhãn phân cách bằng dấu chấm. Hãy xác định đúng tên miền đăng ký, không chỉ nhìn phần đầu."
    );
  }

  if (host.length > 50) {
    flag(
      "long-host",
      7,
      "Tên miền dài bất thường",
      "Tên miền dài có thể khiến người dùng khó nhận ra địa chỉ thật. Đây chỉ là dấu hiệu tham khảo."
    );
  }

  if ((host.match(/-/g) || []).length >= 3) {
    flag(
      "many-hyphens",
      8,
      "Nhiều dấu gạch nối trong tên miền",
      "Tên miền chứa nhiều dấu gạch nối. Hãy so sánh với địa chỉ chính thức nếu liên kết tự nhận thuộc về một tổ chức."
    );
  }

  if (/\d{5,}/.test(host)) {
    flag(
      "long-digit-sequence",
      6,
      "Chuỗi số dài trong tên miền",
      "Tên miền có một chuỗi chữ số dài. Đây là dấu hiệu yếu và cũng có thể xuất hiện ở dịch vụ hợp pháp."
    );
  }

  // 5. Giả mạo thương hiệu: chỉ kiểm tra hostname, không tìm từ khóa
  // thương hiệu trong path hoặc query.
  for (const brand of BRANDS) {
    const exactOrSubdomain = brand.domains.some(
      official => host === official || host.endsWith("." + official)
    );

    if (exactOrSubdomain) continue;

    const brandPattern = new RegExp(
      brand.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
      "i"
    );

    if (brandPattern.test(host)) {
      flag(
        "brand-" + brand.name.toLowerCase(),
        22,
        "Có thể giả mạo thương hiệu " + brand.name,
        "Tên thương hiệu xuất hiện trong hostname nhưng hostname không khớp các tên miền được đưa vào danh sách tham khảo. Hãy tự mở ứng dụng hoặc website chính thức để xác minh.",
        "high"
      );
    }
  }

  // 6. Ký tự @, thông tin định tuyến
  if (url.href.includes("@")) {
    flag(
      "at-sign",
      18,
      "Có ký tự @ trong URL",
      "Ký tự @ trong URL có thể khiến người dùng nhầm phần trước nó là tên website. Hãy đọc hostname mà trình duyệt thực sự phân tích."
    );
  }

  // 7. Cổng không phổ biến
  if (url.port && !["80", "443"].includes(url.port)) {
    flag(
      "unusual-port",
      7,
      "Sử dụng cổng kết nối không phổ biến",
      "URL chỉ định một cổng khác với cổng HTTP/HTTPS thông thường. Điều này có thể hợp lệ nhưng cần kiểm tra nguồn gửi link."
    );
  }

  // 8. Từ khóa nhạy cảm: chỉ cộng điểm khi có từ khóa trong path/query,
  // không tính hostname chính thức chỉ vì chứa một từ chung chung.
  const pathQuery = (url.pathname + " " + url.search).toLowerCase();
  const foundWords = [...SUSPICIOUS_WORDS].filter(word =>
    new RegExp("(^|[^a-z])" + word + "([^a-z]|$)", "i").test(pathQuery)
  );

  if (foundWords.length >= 2) {
    flag(
      "sensitive-words",
      9,
      "Nhiều từ khóa nhạy cảm trong đường dẫn",
      "Đường dẫn chứa các từ như " + foundWords.slice(0, 5).join(", ") +
      ". Những từ này cũng thường xuất hiện ở dịch vụ hợp pháp, nên không đủ để kết luận lừa đảo."
    );
  }

  // 9. URL dài
  if (full.length > 180) {
    flag(
      "long-url",
      5,
      "URL dài bất thường",
      "URL dài có thể che khuất phần hostname hoặc tham số quan trọng. Nhiều liên kết hợp pháp cũng dài."
    );
  }

  // 10. Mã hóa và ký tự điều hướng
  if (/%(?:2f|5c|40|3a|2e)/i.test(full)) {
    flag(
      "encoded-structure",
      7,
      "Có ký tự cấu trúc được mã hóa",
      "URL có ký tự mã hóa tương ứng với dấu phân cách hoặc ký tự đặc biệt. Hãy kiểm tra kỹ ngữ cảnh; mã hóa URL tự nó là bình thường."
    );
  }

  if (decoded !== full && /https?:\/\//i.test(decoded.replace(full, ""))) {
    flag(
      "nested-url",
      10,
      "Có URL lồng trong dữ liệu đã giải mã",
      "Một phần dữ liệu URL sau giải mã có chứa chuỗi giống địa chỉ web khác. Đây có thể là tham số chuyển hướng hoặc nội dung hợp lệ; hãy kiểm tra đích chuyển hướng."
    );
  }

  // 11. Dịch vụ rút gọn link
  if (SHORTENERS.has(host)) {
    flag(
      "shortener",
      12,
      "Dịch vụ rút gọn liên kết",
      "Hostname thuộc danh sách dịch vụ rút gọn phổ biến. Đích cuối chưa được kiểm tra vì công cụ không truy cập URL."
    );
  }

  // 12. Địa chỉ localhost / tên máy nội bộ
  if (
    host === "localhost" ||
    host.endsWith(".localhost") ||
    host.endsWith(".local")
  ) {
    flag(
      "local-host",
      3,
      "Tên máy cục bộ",
      "URL trỏ tới tên máy cục bộ hoặc mạng nội bộ. Điều này thường phù hợp khi phát triển phần mềm, không phải website công khai."
    );
  }

  // 13. Fragment / query không được dùng làm bằng chứng độc lập
  // Không cộng điểm chỉ vì có dấu #, ?, dấu gạch nối đơn hoặc percent-encoding thông thường.

  // 14. Tính điểm có giới hạn
  const rawScore = findings.reduce((sum, item) => sum + item.points, 0);
  const score = Math.min(MAX_SCORE, rawScore);

  // Một số điểm đến từ các dấu hiệu yếu. Không gọi đây là xác suất.
  let label;
  let color;
  let summary;

  if (score >= 45) {
    label = "NHIỀU DẤU HIỆU ĐÁNG NGỜ";
    color = "var(--red)";
    summary =
      "Phát hiện nhiều dấu hiệu cần xem xét. Không nhập mật khẩu, mã OTP hoặc thông tin thanh toán trước khi xác minh địa chỉ.";
  } else if (score >= 25) {
    label = "CẦN KIỂM TRA KỸ";
    color = "var(--yellow)";
    summary =
      "Có một số dấu hiệu cần xác minh thêm. Hãy kiểm tra hostname và nguồn gửi liên kết trước khi tiếp tục.";
  } else if (score >= 10) {
    label = "CÓ DẤU HIỆU CẦN LƯU Ý";
    color = "var(--yellow)";
    summary =
      "Phát hiện ít nhất một dấu hiệu đáng chú ý. Chưa đủ dữ liệu để kết luận website an toàn hoặc độc hại.";
  } else {
    label = "ÍT DẤU HIỆU ĐƯỢC PHÁT HIỆN";
    color = "var(--green)";
    summary =
      "Các quy tắc cục bộ chưa phát hiện nhiều dấu hiệu đáng ngờ. Điều này KHÔNG chứng minh URL an toàn.";
  }

  if (findings.length === 0) {
    findings.push({
      id: "no-findings",
      points: 0,
      title: "Không phát hiện dấu hiệu nổi bật",
      description:
        "URL vượt qua các kiểm tra cấu trúc cơ bản. Công cụ chưa kiểm tra nội dung trang, chứng chỉ thực tế, mã độc hoặc cơ sở dữ liệu phishing."
    });
  }

  return {
    url: url.href,
    host,
    domain,
    protocol: url.protocol,
    score,
    rawScore,
    label,
    color,
    findings,
    summary,
    checkedAt: new Date().toLocaleString("vi-VN")
  };
}

// ==================== HIỂN THỊ KẾT QUẢ ====================

let latestReport = null;

function renderResult(report) {
  $("#gauge").style.setProperty("--score", report.score);
  $("#gauge").style.setProperty("--gauge-color", report.color);

  $("#scoreNumber").textContent = report.score;
  $("#riskTag").textContent = report.label;
  $("#resultTitle").textContent = "Kết quả kiểm tra";
  $("#resultSummary").textContent = report.summary;

  const list = $("#detailList");
  list.replaceChildren();

  for (const finding of report.findings) {
    const article = document.createElement("article");
    article.className = "detail-item";

    const title = document.createElement("h3");
    title.textContent = finding.title;

    const description = document.createElement("p");
    description.textContent = finding.description;

    article.append(title, description);
    list.appendChild(article);
  }

  const details = [
    ["Hostname", report.host],
    ["Tên miền ước lượng", report.domain],
    ["Giao thức", report.protocol.toUpperCase()],
    ["Thời điểm phân tích", report.checkedAt],
    ["URL đã phân tích", report.url]
  ];

  for (const [heading, value] of details) {
    const article = document.createElement("article");
    article.className = "detail-item";

    const title = document.createElement("h3");
    title.textContent = heading;

    const content = document.createElement("p");
    content.textContent = value;

    article.append(title, content);
    list.appendChild(article);
  }

  latestReport = report;
  $("#resultPanel").classList.remove("hidden");
}

// ==================== SỰ KIỆN KIỂM TRA ====================

$("#scanForm").addEventListener("submit", event => {
  event.preventDefault();

  $("#resultPanel").classList.add("hidden");
  latestReport = null;

  const button = $("#scanButton");
  button.disabled = true;
  button.textContent = "Đang kiểm tra...";

  hideStatus($("#scanStatus"));

  try {
    const report = analyzeUrl($("#urlInput").value);
    renderResult(report);

    showStatus(
      $("#scanStatus"),
      "Đã hoàn tất phân tích cấu trúc URL trên thiết bị.",
      "success"
    );

    $("#resultPanel").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  } catch (error) {
    showStatus(
      $("#scanStatus"),
      error.message || "Không thể phân tích URL.",
      "error"
    );
  } finally {
    button.disabled = false;
    button.textContent = "⌕ Phân tích";
  }
});

$("#clearResult").addEventListener("click", () => {
  latestReport = null;
  $("#resultPanel").classList.add("hidden");
  hideStatus($("#scanStatus"));
  $("#urlInput").focus();
});

$("#copyReport").addEventListener("click", async () => {
  if (!latestReport) return;

  const reportText = [
    "LINKGUARD AI — BÁO CÁO PHÂN TÍCH CỤC BỘ",
    "URL: " + latestReport.url,
    "Hostname: " + latestReport.host,
    "Điểm nghi ngờ: " + latestReport.score + "/100",
    "Phân loại: " + latestReport.label,
    "Thời điểm: " + latestReport.checkedAt,
    "",
    latestReport.summary,
    "",
    ...latestReport.findings.map((item, index) =>
      `${index + 1}. ${item.title}\n${item.description}`
    ),
    "",
    "Lưu ý: Điểm số không phải xác suất URL độc hại.",
    "Công cụ không truy cập URL hoặc kiểm tra cơ sở dữ liệu phishing."
  ].join("\n");

  try {
    await navigator.clipboard.writeText(reportText);
    showStatus($("#scanStatus"), "Đã sao chép báo cáo.", "success");
  } catch {
    showStatus(
      $("#scanStatus"),
      "Không thể sao chép tự động. Hãy mở website qua HTTPS hoặc sao chép thủ công.",
      "error"
    );
  }
});

// ==================== ĐÁNH GIÁ WEBSITE ====================

const REVIEW_KEY = "linkguard_local_reviews_v2";

function getReviews() {
  try {
    const data = JSON.parse(localStorage.getItem(REVIEW_KEY) || "[]");

    if (!Array.isArray(data)) return [];

    return data
      .filter(item =>
        item &&
        typeof item.name === "string" &&
        typeof item.text === "string" &&
        typeof item.date === "string"
      )
      .slice(-50);
  } catch {
    return [];
  }
}

function renderReviews() {
  const list = $("#reviewList");
  list.replaceChildren();

  const reviews = getReviews();

  if (!reviews.length) {
    const message = document.createElement("p");
    message.className = "muted";
    message.textContent = "Chưa có đánh giá trên thiết bị này.";
    list.appendChild(message);
  }

  reviews.slice().reverse().forEach(review => {
    const card = document.createElement("article");
    card.className = "review";

    const name = document.createElement("strong");
    name.textContent = review.name;

    const time = document.createElement("time");
    time.textContent = " · " + review.date;

    const content = document.createElement("p");
    content.textContent = review.text;

    card.append(name, time, content);
    list.appendChild(card);
  });

  $("#clearReviews").classList.toggle("hidden", reviews.length === 0);
}

$("#reviewForm").addEventListener("submit", event => {
  event.preventDefault();

  const name = $("#reviewName").value.trim();
  const text = $("#reviewText").value.trim();

  if (!name || !text) {
    showStatus(
      $("#reviewStatus"),
      "Hãy nhập tên và nội dung đánh giá.",
      "error"
    );
    return;
  }

  try {
    const reviews = getReviews();

    reviews.push({
      name: name.slice(0, 50),
      text: text.slice(0, 1000),
      date: new Date().toLocaleString("vi-VN")
    });

    localStorage.setItem(
      REVIEW_KEY,
      JSON.stringify(reviews.slice(-50))
    );

    $("#reviewForm").reset();
    renderReviews();

    showStatus(
      $("#reviewStatus"),
      "Đã lưu đánh giá trên thiết bị này.",
      "success"
    );
  } catch {
    showStatus(
      $("#reviewStatus"),
      "Không thể lưu đánh giá trong trình duyệt.",
      "error"
    );
  }
});

$("#clearReviews").addEventListener("click", () => {
  if (!confirm("Bạn có chắc muốn xóa đánh giá trên thiết bị này?")) {
    return;
  }

  try {
    localStorage.removeItem(REVIEW_KEY);
    renderReviews();

    showStatus(
      $("#reviewStatus"),
      "Đã xóa đánh giá.",
      "success"
    );
  } catch {
    showStatus(
      $("#reviewStatus"),
      "Không thể xóa dữ liệu.",
      "error"
    );
  }
});

renderReviews();
</script>
