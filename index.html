
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tổ dân phố Trần Phú - Đà Lạt</title>
<style>
:root{--g:#176b45;--d:#104c32;--bg:#f4f7f5;--line:#e0e9e2;--gold:#e5b94f}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#26352c}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{background:linear-gradient(120deg,var(--d),#268255);color:white;padding:22px 5%}
.head{max-width:1200px;margin:auto;display:flex;align-items:center;gap:15px}
.logo{width:58px;height:58px;border-radius:50%;background:white;color:var(--g);display:grid;place-items:center;font-size:23px;font-weight:bold;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
header h1{font-size:22px;margin:0 0 5px}
header p{margin:0;font-size:12px;color:#d9eadf}
.head-right{margin-left:auto;display:flex;gap:9px;align-items:center}
nav{background:white;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0001}
.nav{max-width:1200px;margin:auto;display:flex;flex-wrap:wrap}
.nav button{background:none;border:0;padding:16px 15px;color:#405448;font-weight:bold;border-bottom:3px solid transparent}
.nav button.active,.nav button:hover{color:var(--g);border-color:var(--g)}
main{max-width:1200px;margin:25px auto;padding:0 17px;min-height:65vh}
.hero{padding:48px 30px;border-radius:15px;color:white;background:linear-gradient(110deg,#104c32ed,#176b45d9),url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1400') center/cover}
.hero small{color:#f5d77e;letter-spacing:2px}
.hero h2{font-size:32px;max-width:700px}
.hero p{max-width:650px}
h2.section{color:var(--d);margin:30px 0 15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card,.panel{background:white;padding:20px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.card h3{color:var(--g);margin-top:5px}
.post-card{padding:0;overflow:hidden;cursor:pointer;transition:.18s;border:1px solid var(--line)}
.post-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px #173d2618}
.post-card .post-body{padding:16px 18px}
.post-card .postimg{display:block;width:100%;height:190px;object-fit:cover;border-radius:0}
.post-card .post-excerpt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.post-detail-image{width:100%;max-height:480px;object-fit:contain;border-radius:10px;background:#f1f4f1}
.post-detail-content{white-space:pre-wrap;line-height:1.75;font-size:15px;overflow-wrap:anywhere}
.role-chip{display:inline-block;padding:4px 8px;border-radius:20px;background:#eaf4ed;color:var(--g);font-size:11px;font-weight:bold}
.card p{font-size:14px;color:#617168;white-space:pre-wrap}
.card img.postimg{width:100%;height:170px;object-fit:cover;border-radius:8px}
.muted{font-size:12px;color:#829087}
.tag{display:inline-block;background:#eaf4ed;color:var(--g);padding:5px 9px;border-radius:5px;font-size:11px;font-weight:bold}
.btn{background:var(--g);color:white;border:0;padding:10px 15px;border-radius:7px;font-weight:bold}
.btn:hover{filter:brightness(.9)}
.btn.gold{background:var(--gold);color:#26352c}
.btn.gray{background:#eaf1ec;color:var(--g)}
.btn.red{background:#b93838}
.btn.sm{padding:6px 9px;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.form{max-width:650px;margin:auto;background:white;padding:22px;border:1px solid var(--line);border-radius:12px}
.field{margin:13px 0}
.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d5dfd8;border-radius:7px;background:white}
.field textarea{min-height:110px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.stat{background:white;padding:17px;border-radius:10px;border:1px solid var(--line)}
.stat strong{display:block;font-size:25px;color:var(--g)}
.stat span{font-size:12px;color:#718078}
.tablebox{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:680px}
td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}
th{background:#edf5ef;color:var(--d)}
td select{padding:7px;border:1px solid var(--line);border-radius:6px}
.avatar{width:100px;height:100px;border-radius:50%;background:#e8f0ea;display:grid;place-items:center;overflow:hidden;border:3px solid #d5e6da;font-size:32px;color:var(--g)}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.notice{padding:13px;background:#edf6f0;color:#245a38;border-radius:8px;margin:12px 0;font-size:13px}
.empty{text-align:center;padding:30px;color:#78867d;background:white;border-radius:10px}
.modalbg{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:15px}
.modalbg.show{display:flex}
.modal{background:white;border-radius:13px;padding:23px;width:100%;max-width:470px;max-height:90vh;overflow:auto}
.modal h2{color:var(--g)}
.close{float:right;border:0;background:none;font-size:24px}
footer{background:var(--d);color:white;text-align:center;padding:30px 15px;margin-top:45px}
footer p{font-size:13px;color:#c7dfcf}
.hidden{display:none!important}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.nav{justify-content:center}.nav button{padding:12px 9px;font-size:12px}header h1{font-size:16px}.hero h2{font-size:25px}}
@media(max-width:450px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.logo{width:45px;height:45px}.head-right{gap:3px}.head-right .btn{font-size:11px;padding:8px}}
</style>
</head>
<body>

<header>
 <div class="head">
  <div class="logo" id="headerLogo">TP</div>
  <div>
   <h1>TỔ DÂN PHỐ TRẦN PHÚ</h1>
   <p>PHƯỜNG XUÂN HƯƠNG - ĐÀ LẠT</p>
   <p>Cổng thông tin điện tử cộng đồng dân cư</p>
  </div>
  <div class="head-right">
   <button class="btn gold" id="accountButton" onclick="accountAction()">Đăng nhập</button>
  </div>
 </div>
</header>

<nav><div class="nav" id="nav">
 <button class="active" onclick="go('home',this)">Trang chủ</button>
 <button onclick="go('activities',this)">Hoạt động</button>
 <button onclick="go('posts',this)">Bài viết</button>
 <button onclick="go('questions',this)">Hỏi đáp</button>
 <button onclick="go('feedback',this)">Góp ý</button>
 <button id="profileNav" class="hidden" onclick="go('profile',this)">Tài khoản</button>
 <button id="adminNav" class="hidden" onclick="go('admin',this)">Quản trị</button>
</div></nav>

<main id="app"></main>

<footer>
 <strong>TỔ DÂN PHỐ TRẦN PHÚ</strong>
 <p>Phường Xuân Hương - Đà Lạt</p>
 <p>Đoàn kết - Văn minh - Nghĩa tình - Phát triển</p>
 <p>© 2026 - Cổng thông tin điện tử cộng đồng</p>
</footer>

<div class="modalbg" id="modal">
 <div class="modal">
  <button class="close" onclick="closeModal()">×</button>
  <h2 id="modalTitle">Thông tin</h2>
  <div id="modalBody"></div>
 </div>
</div>

<script>
// ===================================
// CƠ SỞ DỮ LIỆU THỬ NGHIỆM
// ===================================

const ADMIN_EMAIL="anhduydl2012@gmail.com";
const KEY="tranphu_website_v1";
let db=JSON.parse(localStorage.getItem(KEY)||"null");

if(!db){
 db={users:[],posts:[],questions:[],feedback:[]};
}

db.users ||= [];
db.posts ||= [];
db.questions ||= [];
db.feedback ||= [];

db.users.forEach(u=>{
 u.email=String(u.email||"").trim().toLowerCase();
 u.role ||= "USER";
 if(u.role==="EDITOR")u.role="MODERATION";
 u.name ||= "";
 u.avatar ||= "";
 u.locked ||= false;
});

// Nhận diện tài khoản ADMIN chính
function roleOf(email){
 const normalized=String(email||"").trim().toLowerCase();
 if(normalized===ADMIN_EMAIL)return "ADMIN";
 const found=db.users.find(u=>String(u.email||"").trim().toLowerCase()===normalized);
 const role=found?.role||"USER";
 return role==="EDITOR"?"MODERATION":role;
}

function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
}

let currentUser=null;
let page="home";

function user(){
 return db.users.find(u=>u.email===currentUser?.email);
}
function isAdmin(){return !!currentUser&&roleOf(currentUser.email)==="ADMIN"}
function canEdit(){return !!currentUser&&["ADMIN","MODERATION"].includes(roleOf(currentUser.email))}
function escapeHTML(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function avatarHTML(u,size=100){
 return `<div class="avatar" style="width:${size}px;height:${size}px">${u?.avatar?`<img src="${u.avatar}" alt="Avatar">`:"👤"}</div>`;
}

// ===================================
// GIAO DIỆN VÀ ĐIỀU HƯỚNG
// ===================================

function go(p,btn){
 page=p;
 document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active");
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}

function updateNav(){
 const u=user();
 document.getElementById("profileNav").classList.toggle("hidden",!currentUser);
 document.getElementById("adminNav").classList.toggle("hidden",!isAdmin());

 const b=document.getElementById("accountButton");
 b.textContent=currentUser?"Đăng xuất":"Đăng nhập";

 const logo=document.getElementById("headerLogo");
 logo.innerHTML=u?.avatar?`<img src="${u.avatar}" alt="Logo tài khoản">`:"TP";
}

function accountAction(){
 if(currentUser)logout();
 else auth("login");
}

function render(){
 updateNav();
 const app=document.getElementById("app");
 const pages={
 home:homePage,
 activities:()=>contentPage("activity"),
 posts:()=>contentPage("post"),
 questions:questionPage,
 feedback:feedbackPage,
 profile:profilePage,
 admin:adminPage
 };
 if(!pages[page])page="home";
 if(page==="admin"&&!isAdmin())page="home";
 app.innerHTML=pages[page]();
}

// ===================================
// TRANG CHỦ
// ===================================

function homePage(){
 return `
 <section class="hero">
  <small>CỔNG THÔNG TIN ĐIỆN TỬ</small>
  <h2>Chung tay xây dựng Tổ dân phố Trần Phú văn minh, đoàn kết và phát triển</h2>
  <p>Nơi kết nối cộng đồng, chia sẻ thông tin và cập nhật các hoạt động của địa phương.</p>
  <button class="btn gold" onclick="go('activities')">Khám phá hoạt động →</button>
 </section>
 <h2 class="section">Thông tin cộng đồng</h2>
 <div class="grid">
  <div class="card"><h3>🏘️ Đoàn kết</h3><p>Phát huy tinh thần đoàn kết và tương trợ trong cộng đồng.</p></div>
  <div class="card"><h3>🌱 Văn minh</h3><p>Xây dựng môi trường sống xanh, sạch, đẹp.</p></div>
  <div class="card"><h3>🤝 Kết nối</h3><p>Lắng nghe ý kiến và cùng nhau xây dựng địa phương.</p></div>
 </div>
 <h2 class="section">Hoạt động mới nhất</h2>
 ${cards(db.posts.filter(p=>p.type==="activity").slice().reverse().slice(0,3))}
 <h2 class="section">Bài viết mới nhất</h2>
 ${cards(db.posts.filter(p=>p.type==="post").slice().reverse().slice(0,3))}
 `;
}

function cards(items){
 if(!items.length)return `<div class="empty">Chưa có nội dung.</div>`;
 return `<div class="grid">${items.map(p=>`
 <article class="card post-card" onclick="viewPost(${p.id})" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();viewPost(${p.id})}">
  ${p.image?`<img class="postimg" src="${escapeHTML(p.image)}" alt="Ảnh bài đăng" onerror="this.style.display='none'">`:""}
  <div class="post-body"><span class="tag">${p.type==="activity"?"HOẠT ĐỘNG":"BÀI VIẾT"}</span>
  <p class="muted">${escapeHTML(p.date||"")}${p.author?` · ${escapeHTML(p.author)}`:""}</p>
  <h3>${escapeHTML(p.title)}</h3><p class="post-excerpt">${escapeHTML(p.content)}</p>
  <span class="muted" style="color:var(--g);font-weight:bold">Xem chi tiết →</span>
  ${canEdit()?`<div class="actions" onclick="event.stopPropagation()"><button class="btn sm" onclick="editPost(${p.id})">Sửa</button><button class="btn red sm" onclick="deleteRecord('posts',${p.id})">Xóa</button></div>`:""}</div>
 </article>`).join("")}</div>`;
}

function viewPost(id){
 const p=db.posts.find(x=>x.id===id);if(!p)return;
 showModal(p.title,`<span class="tag">${p.type==="activity"?"HOẠT ĐỘNG":"BÀI VIẾT"}</span><p class="muted">${escapeHTML(p.date||"")}${p.author?` · ${escapeHTML(p.author)}`:""}</p>${p.image?`<img class="post-detail-image" src="${escapeHTML(p.image)}" alt="Ảnh bài đăng">`:""}<div class="post-detail-content" style="margin-top:16px">${escapeHTML(p.content)}</div>${canEdit()?`<div class="actions"><button class="btn" onclick="closeModal();editPost(${p.id})">Chỉnh sửa</button><button class="btn red" onclick="closeModal();deleteRecord('posts',${p.id})">Xóa bài</button></div>`:""}`);
}

// ===================================
// BÀI VIẾT VÀ HOẠT ĐỘNG
// ===================================

function contentPage(type){
 const items=db.posts.filter(p=>p.type===type).slice().reverse();
 return `
 <h2 class="section">${type==="activity"?"Hoạt động cộng đồng":"Bài viết và thông báo"}</h2>
 <p class="muted">${type==="activity"?"Các phong trào và sự kiện của tổ dân phố.":"Tin tức và thông tin tuyên truyền."}</p>
 ${canEdit()?`<button class="btn" onclick="openPost('${type}')">+ Đăng nội dung</button>`:""}
 <div style="margin-top:20px">${cards(items)}</div>`;
}

function openPost(type,old=null){
 showModal(old?"Chỉnh sửa nội dung":"Đăng nội dung",`
 <div class="field"><label>Tiêu đề</label><input id="pTitle" maxlength="150" value="${escapeHTML(old?.title||"")}"></div>
 <div class="field"><label>Nội dung</label><textarea id="pContent">${escapeHTML(old?.content||"")}</textarea></div>
 <div class="field"><label>Hình ảnh (Upload từ máy tính)</label><input type="file" id="pImageFile" accept="image/png,image/jpeg,image/webp"></div>
 ${old?.image?`<div class="field"><label>Ảnh hiện tại</label><img src="${escapeHTML(old.image)}" style="width:100%;max-height:180px;object-fit:contain;border-radius:8px"><label style="font-weight:normal"><input type="checkbox" id="removePostImage"> Xóa ảnh hiện tại</label></div>`:""}
 <p class="muted">Ảnh PNG, JPG hoặc WEBP, tối đa 5MB. Ảnh được tối ưu trước khi lưu.</p>
 <button class="btn" onclick="savePost('${type}',${old?.id||"null"})">Đăng bài</button>`);
}

function editPost(id){
 const p=db.posts.find(x=>x.id===id);
 if(p)openPost(p.type,p);
}

function savePost(type,id){
 if(!canEdit())return alert("Bạn không có quyền đăng nội dung.");
 const title=document.getElementById("pTitle").value.trim(),content=document.getElementById("pContent").value.trim(),file=document.getElementById("pImageFile").files[0];
 if(!title||!content)return alert("Vui lòng nhập tiêu đề và nội dung.");
 if(file&&(!file.type.startsWith("image/")||file.size>5*1024*1024))return alert("Chỉ nhận ảnh PNG, JPG, WEBP tối đa 5MB.");
 const finish=image=>{
  const old=id?db.posts.find(x=>x.id===id):null,remove=document.getElementById("removePostImage")?.checked;
  const finalImage=remove?"":(image===null?(old?.image||""):image);
  if(old)Object.assign(old,{title,content,image:finalImage});
  else db.posts.push({id:Date.now(),type,title,content,image:finalImage,date:new Date().toLocaleString("vi-VN"),author:user()?.name||currentUser.email});
  try{save();closeModal();render();alert(id?"Đã cập nhật bài đăng.":"Đăng bài thành công!");}catch(e){alert("Không đủ dung lượng lưu trữ cho ảnh. Hãy chọn ảnh nhỏ hơn.");}
 };
 if(!file)return finish(null);
 const reader=new FileReader();
 reader.onload=e=>{
  const img=new Image();
  img.onload=()=>{
   const c=document.createElement("canvas"),max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));
   c.width=Math.round(img.width*scale);
   c.height=Math.round(img.height*scale);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);
   finish(c.toDataURL("image/jpeg",.78));
  };
  img.onerror=()=>alert("Không thể đọc ảnh đã chọn.");
  img.src=e.target.result;
 };
 reader.readAsDataURL(file);
}

// ===================================
// HỎI ĐÁP
// ===================================

function questionPage(){
 return `
 <h2 class="section">Hỏi đáp cộng đồng</h2>
 <div class="form">
  <div class="field"><label>Nội dung câu hỏi</label><textarea id="qText" placeholder="Nhập câu hỏi..."></textarea></div>
  <button class="btn" onclick="sendQuestion()">Gửi câu hỏi</button>
 </div>
 <h2 class="section">Danh sách câu hỏi</h2>
 ${db.questions.slice().reverse().map(q=>`
 <div class="card">
  <p class="muted">${escapeHTML(q.author)} · ${escapeHTML(q.date)}</p>
  <h3>${escapeHTML(q.text)}</h3>
  ${q.answer?`<div class="notice"><b>Trả lời:</b> ${escapeHTML(q.answer)}</div>`:"<p>Đang chờ phản hồi.</p>"}
  ${isAdmin()?`
  <div class="field"><textarea id="a${q.id}" placeholder="Nhập trả lời">${escapeHTML(q.answer||"")}</textarea></div>
  <button class="btn sm" onclick="answerQuestion(${q.id})">Lưu trả lời</button>
  <button class="btn red sm" onclick="deleteRecord('questions',${q.id})">Xóa</button>`:""}
 </div>`).join("")||`<div class="empty">Chưa có câu hỏi.</div>`}
 `;
}

function sendQuestion(){
 if(!currentUser)return alert("Hãy đăng nhập trước.");
 const text=document.getElementById("qText").value.trim();
 if(!text)return alert("Vui lòng nhập câu hỏi.");
 db.questions.push({id:Date.now(),text,author:user()?.name||currentUser.email,date:new Date().toLocaleString("vi-VN"),answer:""});
 save();render();alert("Đã gửi câu hỏi.");
}

function answerQuestion(id){
 if(!isAdmin())return;
 const q=db.questions.find(x=>x.id===id);
 if(q)q.answer=document.getElementById("a"+id).value.trim();
 save();render();
}

// ===================================
// GÓP Ý
// ===================================

function feedbackPage(){
 return `
 <h2 class="section">Góp ý và phản ánh</h2>
 <div class="form">
  <div class="field"><label>Họ tên</label><input id="fName" value="${escapeHTML(user()?.name||"")}"></div>
  <div class="field"><label>Nội dung góp ý</label><textarea id="fText"></textarea></div>
  <button class="btn" onclick="sendFeedback()">Gửi góp ý</button>
 </div>
 ${isAdmin()?`
 <h2 class="section">Danh sách góp ý</h2>
 ${db.feedback.slice().reverse().map(f=>`
 <div class="card">
  <h3>${escapeHTML(f.name)}</h3>
  <p class="muted">${escapeHTML(f.email)} · ${escapeHTML(f.date)}</p>
  <p>${escapeHTML(f.text)}</p>
  <button class="btn red sm" onclick="deleteRecord('feedback',${f.id})">Xóa</button>
 </div>`).join("")||`<div class="empty">Chưa có góp ý.</div>`}
 `:""}`;
}

function sendFeedback(){
 if(!currentUser)return alert("Hãy đăng nhập trước.");
 const name=document.getElementById("fName").value.trim();
 const text=document.getElementById("fText").value.trim();
 if(!name||!text)return alert("Vui lòng nhập đầy đủ.");
 db.feedback.push({id:Date.now(),name,text,email:currentUser.email,date:new Date().toLocaleString("vi-VN")});
 save();render();alert("Đã gửi góp ý.");
}

// ===================================
// HỒ SƠ CÁ NHÂN - ĐỔI AVATAR
// ===================================

function profilePage(){
 const u=user();
 if(!u)return "";
 return `
 <h2 class="section">Hồ sơ cá nhân</h2>
 <div class="panel">
  <div class="profile-head">
   ${avatarHTML(u)}
   <div>
    <h2>${escapeHTML(u.name||"Thành viên")}</h2>
    <p class="muted">${escapeHTML(u.email)}</p>
    <span class="tag">${escapeHTML(roleOf(u.email))}</span>
   </div>
  </div>
  <hr style="border:0;border-top:1px solid #e0e9e2;margin:22px 0">
  <div class="field">
   <label>Ảnh đại diện mới</label>
   <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp">
  </div>
  <button class="btn" onclick="changeAvatar()">Cập nhật avatar</button>
  <div class="field"><label>Họ và tên</label><input id="myName" value="${escapeHTML(u.name||"")}"></div>
  <div class="field"><label>Email</label><input value="${escapeHTML(u.email)}" disabled></div>
  <button class="btn" onclick="saveProfile()">Lưu thông tin</button>
  <h3 style="margin-top:25px">Đổi mật khẩu</h3>
  <div class="field"><label>Mật khẩu hiện tại</label><input type="password" id="oldPass"></div>
  <div class="field"><label>Mật khẩu mới</label><input type="password" id="newPass"></div>
  <button class="btn gray" onclick="changePassword()">Đổi mật khẩu</button>
 </div>`;
}

function changeAvatar(){
 const file=document.getElementById("avatarFile").files[0];
 if(!file)return alert("Hãy chọn ảnh trước.");
 if(!file.type.startsWith("image/"))return alert("File không phải ảnh.");
 if(file.size>5*1024*1024)return alert("Ảnh tối đa 5MB.");

 const reader=new FileReader();
 reader.onload=e=>{
  const img=new Image();
  img.onload=()=>{
   const canvas=document.createElement("canvas");
   const max=400;
   const scale=Math.min(1,max/Math.max(img.width,img.height));
   canvas.width=Math.round(img.width*scale);
   canvas.height=Math.round(img.height*scale);
   canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
   user().avatar=canvas.toDataURL("image/jpeg",0.8);
   try{save();render();alert("Đã đổi avatar!");}
   catch(err){alert("Ảnh quá lớn để lưu. Hãy chọn ảnh khác.");}
  };
  img.onerror=()=>alert("Không thể đọc ảnh.");
  img.src=e.target.result;
 };
 reader.readAsDataURL(file);
}

function saveProfile(){
 const name=document.getElementById("myName").value.trim();
 if(!name)return alert("Hãy nhập họ tên.");
 user().name=name;
 save();render();alert("Đã cập nhật hồ sơ.");
}

function changePassword(){
 const old=document.getElementById("oldPass").value;
 const next=document.getElementById("newPass").value;
 if(old!==user().password)return alert("Mật khẩu hiện tại không đúng.");
 if(next.length<8)return alert("Mật khẩu mới tối thiểu 8 ký tự.");
 user().password=next;
 save();alert("Đổi mật khẩu thành công.");
}

function changeRole(id){
 if(!isAdmin()||currentUser.email.toLowerCase()!==ADMIN_EMAIL)return alert("Không có quyền thực hiện.");
 const u=db.users.find(x=>x.id===id);if(!u||u.email.toLowerCase()===ADMIN_EMAIL)return;
 u.role=document.getElementById("role"+id).value;
 save();render();alert("Đã cập nhật quyền thành công.");
}

function openPermissionModal(){
 if(!isAdmin()||currentUser.email.toLowerCase()!==ADMIN_EMAIL)return alert("Chỉ ADMIN chính được quản lý quyền.");
 showModal("Thêm / Xóa quyền",`
 <div class="field"><label>Email tài khoản</label><input id="permissionEmail" type="email" placeholder="example@gmail.com"></div>
 <div class="field"><label>Quyền hạn</label>
 <select id="permissionRole">
  <option value="ADMIN">Admin</option>
  <option value="USER">User</option>
  <option value="MODERATION">Moderation</option>
 </select></div>
 <div class="actions">
  <button class="btn" onclick="applyPermission()">Cấp / Cập nhật quyền</button>
  <button class="btn red" onclick="removePermission()">Xóa quyền (đưa về User)</button>
 </div>
 <p class="muted">Tài khoản cần đăng ký trên website trước khi được phân quyền.</p>`);
}

function applyPermission(){
 if(!isAdmin()||currentUser.email.toLowerCase()!==ADMIN_EMAIL)return;
 const email=document.getElementById("permissionEmail").value.trim().toLowerCase();
 const role=document.getElementById("permissionRole").value;
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return alert("Email không hợp lệ.");
 if(email===ADMIN_EMAIL)return alert("Đây là ADMIN chính, không thể thay đổi quyền.");
 const target=db.users.find(u=>u.email.toLowerCase()===email);
 if(!target)return alert("Chưa tìm thấy tài khoản. Hãy yêu cầu người dùng đăng ký trước.");
 target.role=role;
 save();closeModal();render();alert("Đã cập nhật quyền cho "+email+".");
}

function removePermission(){
 if(!isAdmin()||currentUser.email.toLowerCase()!==ADMIN_EMAIL)return;
 const email=document.getElementById("permissionEmail").value.trim().toLowerCase();
 if(!email)return alert("Hãy nhập email tài khoản.");
 if(email===ADMIN_EMAIL)return alert("Không thể gỡ quyền ADMIN chính.");
 const target=db.users.find(u=>u.email.toLowerCase()===email);
 if(!target)return alert("Không tìm thấy tài khoản.");
 target.role="USER";
 save();closeModal();render();alert("Đã gỡ quyền. Tài khoản hiện là User.");
}

function toggleLock(id){
 if(!isAdmin())return;
 const u=db.users.find(x=>x.id===id);
 if(!u||u.email===ADMIN_EMAIL)return;
 u.locked=!u.locked;
 save();render();
}

function deleteUser(id){
 if(!isAdmin())return;
 const u=db.users.find(x=>x.id===id);
 if(!u||u.email===ADMIN_EMAIL)return;
 if(!confirm("Xóa tài khoản này?"))return;
 db.users=db.users.filter(x=>x.id!==id);
 save();render();
}

function deleteRecord(collection,id){
 const allowed=collection==="posts"?canEdit():isAdmin();
 if(!allowed)return alert("Không có quyền.");
 if(!confirm("Bạn chắc chắn muốn xóa?"))return;
 db[collection]=db[collection].filter(x=>x.id!==id);
 save();render();
}

function showModal(title,html){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalBody").innerHTML=html;
 document.getElementById("modal").classList.add("show");
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
}

function auth(mode){
 const html=`
 <div class="field"><label>Email</label><input id="email" type="email" placeholder="example@gmail.com"></div>
 <div class="field"><label>Mật khẩu</label><input id="password" type="password"></div>
 ${mode==="register"?`
 <div class="field"><label>Họ và tên</label><input id="regName"></div>
 <div class="field"><label>Xác nhận mật khẩu</label><input id="confirm" type="password"></div>`:""}
 <button class="btn" style="width:100%" onclick="submitAuth('${mode}')">${mode==="login"?"Đăng nhập":"Đăng ký"}</button>
 <div class="notice">${mode==="login"?
 `Chưa có tài khoản? <a href="#" onclick="auth('register')">Đăng ký</a>`:
 `Đã có tài khoản? <a href="#" onclick="auth('login')">Đăng nhập</a>`}</div>`;
 showModal(mode==="login"?"Đăng nhập":"Tạo tài khoản",html);
}

function submitAuth(mode){
 const email=document.getElementById("email").value.trim().toLowerCase();
 const password=document.getElementById("password").value;
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return alert("Email không hợp lệ.");
 if(password.length<8)return alert("Mật khẩu tối thiểu 8 ký tự.");

 if(mode==="register"){
  const name=document.getElementById("regName").value.trim();
  if(!name)return alert("Hãy nhập họ tên.");
  if(password!==document.getElementById("confirm").value)return alert("Mật khẩu không khớp.");
  if(db.users.some(u=>u.email===email))return alert("Email đã tồn tại.");

  db.users.push({
   id:Date.now(),email,password,name,avatar:"",
   role:email===ADMIN_EMAIL?"ADMIN":"USER",locked:false
  });
  save();alert("Đăng ký thành công. Hãy đăng nhập.");auth("login");return;
 }

 const u=db.users.find(x=>x.email===email&&x.password===password);
 if(!u)return alert("Email hoặc mật khẩu không đúng.");
 if(u.locked&&email!==ADMIN_EMAIL)return alert("Tài khoản đã bị khóa.");
 currentUser={email:u.email};
 closeModal();page="home";render();
 alert("Đăng nhập thành công!");
}

function logout(){
 currentUser=null;page="home";render();
 alert("Đã đăng xuất.");
}
